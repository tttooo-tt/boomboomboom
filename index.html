<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>时间差不多咯💣</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
:root{
  --bg:#FFF5EE;--card:#fff;--primary:#FF6B6B;--primary-light:#FFE0E0;
  --secondary:#FFB347;--accent:#4ECDC4;--accent-light:#E0FFF9;
  --danger:#FF4757;--danger-bg:#FFF0F0;--warning:#FFA502;--warning-bg:#FFF8E7;
  --text:#2D3436;--text-dim:#999;--text-light:#bbb;
  --shadow:0 4px 20px rgba(0,0,0,.06);--shadow-lg:0 8px 40px rgba(0,0,0,.1);
  --radius:16px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--bg);font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB',sans-serif;color:var(--text);overflow-x:hidden}

/* ===== Background Decoration ===== */
.bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-bomb{position:absolute;font-size:28px;opacity:.06;animation:floatBomb 18s ease-in-out infinite alternate}
@keyframes floatBomb{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(15px,-25px) rotate(10deg)}100%{transform:translate(-10px,10px) rotate(-5deg)}}

/* ===== App Layout ===== */
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px 100px}

/* ===== Header ===== */
.app-header{text-align:center;padding:40px 0 24px}
.app-title{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px;line-height:1.3}
.app-subtitle{font-size:13px;color:var(--text-dim);margin-top:6px;letter-spacing:1px}
.header-bomb{display:inline-block;font-size:36px;animation:headerBomb 3s ease-in-out infinite;margin-bottom:8px}
@keyframes headerBomb{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}

/* ===== Category Bar ===== */
.cat-section{margin-bottom:20px}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;-ms-overflow-style:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:2px solid #eee;background:#fff;font-size:13px;font-weight:500;cursor:pointer;transition:all .25s;white-space:nowrap;user-select:none}
.cat-chip:hover{border-color:#ddd;transform:translateY(-1px)}
.cat-chip.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700}
.cat-chip .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-chip .cat-count{background:rgba(0,0,0,.06);padding:1px 7px;border-radius:10px;font-size:11px;color:var(--text-dim)}
.cat-chip.active .cat-count{background:rgba(255,107,107,.15);color:var(--primary)}
.cat-add-chip{flex-shrink:0;padding:8px 14px;border-radius:20px;border:2px dashed #ddd;background:transparent;font-size:13px;color:var(--text-dim);cursor:pointer;transition:all .25s}
.cat-add-chip:hover{border-color:var(--primary);color:var(--primary)}

/* ===== Item Cards ===== */
.items-area{display:flex;flex-direction:column;gap:12px}
.item-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:2px solid transparent;transition:all .3s;position:relative;overflow:hidden}
.item-card.completed{opacity:.6;border-color:#e0e0e0}
.item-card.completed .item-title{text-decoration:line-through;color:var(--text-dim)}
.item-card.warning{border-color:var(--warning);background:var(--warning-bg)}
.item-card.danger{border-color:var(--danger);background:var(--danger-bg);animation:cardPulse 2s ease-in-out infinite}
.item-card.critical{border-color:var(--danger);background:var(--danger-bg);animation:cardPulse .6s ease-in-out infinite}
.item-card.exploded{border-color:#ccc;background:#f8f8f8}
@keyframes cardPulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 20px rgba(255,71,87,.25)}}

.item-top{display:flex;align-items:flex-start;gap:12px}
.item-check{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s;margin-top:2px;background:#fff}
.item-check:hover{border-color:var(--accent);transform:scale(1.1)}
.item-check.checked{background:var(--accent);border-color:var(--accent)}
.item-check.checked::after{content:'\2713';color:#fff;font-size:14px;font-weight:700}
.item-info{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:600;line-height:1.4;word-break:break-word}
.item-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--text-dim);flex-wrap:wrap}
.item-deadline-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.04);font-size:11px}
.item-reminder-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;background:rgba(255,165,2,.1);color:var(--warning);font-size:11px}
.item-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.item-btn{width:32px;height:32px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.item-btn:hover{background:rgba(0,0,0,.05)}
.item-btn.del:hover{background:rgba(255,71,87,.1)}

/* ===== Bomb Countdown ===== */
.bomb-countdown{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);background:rgba(255,71,87,.06)}
.bomb-icon{font-size:28px;display:inline-block;line-height:1}
.bomb-icon.warning-anim{animation:bombBob 1.5s ease-in-out infinite}
.bomb-icon.danger-anim{animation:bombShake .4s ease-in-out infinite}
.bomb-icon.critical-anim{animation:bombShake .12s ease-in-out infinite}
.bomb-icon.exploded-anim{animation:bombExplode .5s forwards}
@keyframes bombBob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bombShake{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-5deg)}50%{transform:translate(2px,-1px) rotate(3deg)}75%{transform:translate(-1px,2px) rotate(-2deg)}}
@keyframes bombExplode{0%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.8}100%{transform:scale(.5);opacity:0}}
.countdown-text{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px}
.countdown-text.warning-text{color:var(--warning)}
.countdown-text.danger-text{color:var(--danger);animation:textPulse 1s ease-in-out infinite}
.countdown-text.critical-text{color:var(--danger);animation:textPulse .3s ease-in-out infinite}
@keyframes textPulse{0%,100%{opacity:1}50%{opacity:.5}}
.countdown-label{font-size:11px;color:var(--text-dim);margin-top:2px}
.exploded-text{font-size:14px;font-weight:700;color:var(--danger)}

/* ===== Explosion Particles ===== */
.explosion-container{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;animation:particleFly 1s ease-out forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}

/* ===== Defused Animation ===== */
.defused-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:48px;pointer-events:none;z-index:5;animation:defusePop .5s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes defusePop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}60%{transform:translate(-50%,-50%) scale(1.2) rotate(5deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}

/* ===== Empty State ===== */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:64px;margin-bottom:16px;animation:emptyBounce 3s ease-in-out infinite}
@keyframes emptyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.empty-desc{font-size:13px;color:var(--text-dim);line-height:1.6}

/* ===== FAB ===== */
.fab{position:fixed;bottom:28px;right:50%;transform:translateX(calc(50% + 200px));width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:28px;cursor:pointer;box-shadow:0 6px 24px rgba(255,107,107,.4);transition:all .3s;z-index:50;display:flex;align-items:center;justify-content:center}
.fab:hover{transform:translateX(calc(50% + 200px)) scale(1.1);box-shadow:0 8px 32px rgba(255,107,107,.5)}
.fab:active{transform:translateX(calc(50% + 200px)) scale(.95)}
@media(max-width:560px){.fab{right:20px;transform:none}.fab:hover{transform:scale(1.1)}.fab:active{transform:scale(.95)}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;opacity:0;visibility:hidden;transition:all .3s;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.show{opacity:1;visibility:visible}
.modal-box{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;transform:translateY(100%);transition:transform .35s cubic-bezier(.23,1,.32,1);max-height:85vh;overflow-y:auto}
.modal-overlay.show .modal-box{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border:none;background:rgba(0,0,0,.05);border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all .2s}
.modal-close:hover{background:rgba(0,0,0,.1)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:6px}
.form-input{width:100%;padding:12px 14px;border:2px solid #eee;border-radius:var(--radius-sm);font-size:15px;font-family:inherit;outline:none;transition:border-color .25s;background:#fafafa}
.form-input:focus{border-color:var(--primary);background:#fff}
.color-picker{display:flex;gap:10px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:all .2s}
.color-opt:hover{transform:scale(1.15)}
.color-opt.selected{border-color:var(--text);transform:scale(1.15)}
.reminder-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.reminder-chip{padding:6px 12px;border-radius:16px;border:2px solid #eee;background:#fff;font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.reminder-chip:hover{border-color:#ddd}
.reminder-chip.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600}
.form-submit{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .25s;letter-spacing:1px}
.form-submit:hover{opacity:.9;transform:translateY(-1px)}
.form-submit:active{transform:translateY(0)}

/* ===== Category Management Row ===== */
.cat-manage{display:flex;gap:6px;margin-top:4px}
.cat-manage-btn{font-size:11px;color:var(--text-dim);cursor:pointer;padding:2px 8px;border-radius:6px;transition:all .2s;border:1px solid transparent}
.cat-manage-btn:hover{color:var(--primary);border-color:var(--primary-light);background:var(--primary-light)}
.cat-manage-btn.del-cat:hover{color:var(--danger);border-color:rgba(255,71,87,.15);background:rgba(255,71,87,.06)}

/* ===== Toast ===== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);padding:12px 24px;border-radius:12px;background:var(--text);color:#fff;font-size:14px;font-weight:500;z-index:200;transition:transform .4s cubic-bezier(.23,1,.32,1);white-space:nowrap;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== Responsive ===== */
@media(max-width:400px){
  .app-title{font-size:26px}
  .item-card{padding:14px}
  .bomb-countdown{padding:8px 10px}
  .countdown-text{font-size:16px}
}
</style>
</head>
<body>

<!-- Background Decoration -->
<div class="bg-decor" id="bgDecor"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- App -->
<div class="app">
  <header class="app-header">
    <div class="header-bomb">💣</div>
    <div class="app-title">时间差不多咯💣</div>
    <div class="app-subtitle">To do list还没做完会完了 - 待办清单管理器</div>
  </header>

  <div class="cat-section">
    <div class="cat-bar" id="catBar"></div>
    <div class="cat-manage" id="catManage"></div>
  </div>

  <div class="items-area" id="itemsArea"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" title="添加待办">+</button>

<!-- Category Modal -->
<div class="modal-overlay" id="catModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">💣 新建分类</span>
      <button class="modal-close" onclick="closeModal('catModal')">&times;</button>
    </div>
    <form id="catForm" onsubmit="return handleCatSubmit(event)">
      <div class="form-group">
        <label class="form-label">分类名称</label>
        <input class="form-input" id="catNameInput" placeholder="例如：工作、学习、生活..." maxlength="20" required>
      </div>
      <div class="form-group">
        <label class="form-label">选个颜色</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
      <button type="submit" class="form-submit">创建分类 💣</button>
    </form>
  </div>
</div>

<!-- Item Modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">💣 新建待办</span>
      <button class="modal-close" onclick="closeModal('itemModal')">&times;</button>
    </div>
    <form id="itemForm" onsubmit="return handleItemSubmit(event)">
      <div class="form-group">
        <label class="form-label">待办内容</label>
        <input class="form-input" id="itemTitleInput" placeholder="要做什么事？快写下来！" maxlength="100" required>
      </div>
      <div class="form-group">
        <label class="form-label">截止时间</label>
        <input class="form-input" id="itemDeadlineInput" type="datetime-local" required>
      </div>
      <div class="form-group">
        <label class="form-label">提前多久提醒（进入炸弹倒计时）</label>
        <div class="reminder-presets" id="reminderPresets"></div>
        <input class="form-input" id="itemReminderInput" type="number" min="1" placeholder="自定义分钟数" style="margin-top:6px">
      </div>
      <button type="submit" class="form-submit">添加待办 💣</button>
    </form>
  </div>
</div>

<script>
/* ===== Constants ===== */
var STORAGE_KEY = 'bombTodoAppData_v1';
var CATEGORY_COLORS = ['#FF6B6B','#FFB347','#4ECDC4','#A29BFE','#FD79A8','#6C5CE7','#00CEC9','#E17055','#FDCB6E','#55E6C1'];
var REMINDER_PRESETS = [
  {label:'5\u5206\u949F',value:5},
  {label:'15\u5206\u949F',value:15},
  {label:'30\u5206\u949F',value:30},
  {label:'1\u5c0f\u65f6',value:60},
  {label:'2\u5c0f\u65f6',value:120},
  {label:'1\u5929',value:1440}
];

/* ===== State ===== */
var state = loadData();
var countdownTimer = null;
var selectedReminder = 30;

/* ===== Utility ===== */
function genId(){return Date.now().toString(36)+'_'+Math.random().toString(36).substr(2,6)}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

function loadData(){
  try{
    var d=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(d&&d.categories)return d;
  }catch(e){}
  return {categories:[],selectedCategoryId:null};
}
function saveData(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2200);
}

function getSelectedCategory(){
  if(!state.selectedCategoryId&&state.categories.length>0){
    state.selectedCategoryId=state.categories[0].id;
  }
  return state.categories.find(function(c){return c.id===state.selectedCategoryId})||null;
}

/* ===== Time Helpers ===== */
function getTimeStatus(item){
  if(item.completed)return 'completed';
  var now=Date.now();
  var deadline=new Date(item.deadline).getTime();
  var diff=deadline-now;
  if(diff<=0)return 'exploded';
  var reminderMs=item.reminderMinutes*60*1000;
  if(diff>reminderMs)return 'safe';
  var ratio=diff/reminderMs;
  if(ratio>0.5)return 'warning';
  if(ratio>0.1)return 'danger';
  return 'critical';
}

function formatDeadline(iso){
  var d=new Date(iso);
  var m=d.getMonth()+1;
  var day=d.getDate();
  var h=d.getHours().toString().padStart(2,'0');
  var min=d.getMinutes().toString().padStart(2,'0');
  return m+'\u6708'+day+'\u65e5 '+h+':'+min;
}

function formatCountdown(ms){
  if(ms<=0)return '00:00:00';
  var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600);
  var m=Math.floor((s%3600)/60);
  var sec=s%60;
  return h.toString().padStart(2,'0')+':'+m.toString().padStart(2,'0')+':'+sec.toString().padStart(2,'0');
}

function formatReminderLabel(minutes){
  if(minutes<60)return minutes+'\u5206\u949F\u524D';
  if(minutes<1440)return (minutes/60)+'\u5C0F\u65F6\u524D';
  return (minutes/1440)+'\u5929\u524D';
}

/* ===== Render ===== */
function render(){
  renderBg();
  renderCategories();
  renderItems();
}

function renderBg(){
  var el=document.getElementById('bgDecor');
  if(el.children.length>0)return;
  var bombs=['\uD83D\uDCA3','\uD83D\uDD25','\u2B50','\uD83D\uDCA5','\uD83C\uDF1F','\u23F0','\uD83D\uDCA3'];
  var html='';
  for(var i=0;i<bombs.length;i++){
    var top=Math.random()*90;
    var left=Math.random()*90;
    var delay=Math.random()*10;
    var dur=15+Math.random()*10;
    html+='<div class="bg-bomb" style="top:'+top+'%;left:'+left+'%;animation-delay:'+delay+'s;animation-duration:'+dur+'s">'+bombs[i]+'</div>';
  }
  el.innerHTML=html;
}

function renderCategories(){
  var bar=document.getElementById('catBar');
  var manage=document.getElementById('catManage');
  var html='';

  state.categories.forEach(function(cat){
    var active=cat.id===state.selectedCategoryId?'active':'';
    var pending=cat.items.filter(function(it){return !it.completed}).length;
    html+='<div class="cat-chip '+active+'" data-catid="'+cat.id+'" onclick="selectCategory(\''+cat.id+'\')">';
    html+='<span class="cat-dot" style="background:'+cat.color+'"></span>';
    html+=escHtml(cat.name);
    if(pending>0)html+=' <span class="cat-count">'+pending+'</span>';
    html+='</div>';
  });
  html+='<div class="cat-add-chip" onclick="openModal(\'catModal\')">+ \u65B0\u5EFA\u5206\u7C7B</div>';
  bar.innerHTML=html;

  var cat=getSelectedCategory();
  if(cat){
    manage.innerHTML='<span class="cat-manage-btn del-cat" onclick="deleteCategory(\''+cat.id+'\')">\uD83D\uDDD1\uFE0F \u5220\u9664\u8BE5\u5206\u7C7B</span>';
  }else{
    manage.innerHTML='';
  }
}

function renderItems(){
  var area=document.getElementById('itemsArea');
  var cat=getSelectedCategory();

  if(state.categories.length===0){
    area.innerHTML='<div class="empty-state"><div class="empty-icon">\uD83D\uDCA3</div><div class="empty-title">\u8FD8\u6CA1\u6709\u5206\u7C7B</div><div class="empty-desc">\u70B9\u51FB\u4E0A\u65B9\u300C+ \u65B0\u5EFA\u5206\u7C7B\u300D\u5F00\u59CB\u4F7F\u7528\u5427\uFF01<br>\u5148\u5EFA\u5206\u7C7B\uFF0C\u518D\u6DFB\u52A0\u5F85\u529E\u4E8B\u9879 \u2728</div></div>';
    return;
  }
  if(!cat){
    area.innerHTML='';
    return;
  }

  if(cat.items.length===0){
    area.innerHTML='<div class="empty-state"><div class="empty-icon">\u2728</div><div class="empty-title">\u8FD9\u4E2A\u5206\u7C7B\u8FD8\u6CA1\u6709\u5F85\u529E</div><div class="empty-desc">\u70B9\u51FB\u53F3\u4E0B\u89D2\u7684 + \u6309\u94AE\u6DFB\u52A0\u4E00\u4E2A\u5427\uFF01<br>\u522B\u8BA9\u70B8\u5F39\u7206\u70B8\u54E6 \uD83D\uDCA3</div></div>';
    return;
  }

  var sorted=cat.items.slice().sort(function(a,b){
    if(a.completed!==b.completed)return a.completed?1:-1;
    return new Date(a.deadline)-new Date(b.deadline);
  });

  var html='';
  sorted.forEach(function(item){
    var status=getTimeStatus(item);
    var cardClass='item-card';
    if(status!=='safe'&&status!=='completed')cardClass+=' '+status;

    html+='<div class="'+cardClass+'" id="card_'+item.id+'">';

    /* Top Row */
    html+='<div class="item-top">';
    html+='<div class="item-check'+(item.completed?' checked':'')+'" onclick="toggleItem(\''+cat.id+'\',\''+item.id+'\')"></div>';
    html+='<div class="item-info">';
    html+='<div class="item-title">'+escHtml(item.title)+'</div>';
    html+='<div class="item-meta">';
    html+='<span class="item-deadline-tag">\u23F0 '+formatDeadline(item.deadline)+'</span>';
    html+='<span class="item-reminder-tag">\uD83D\uDCA3 '+formatReminderLabel(item.reminderMinutes)+'\u63D0\u9192</span>';
    html+='</div></div>';
    html+='<div class="item-actions">';
    html+='<button class="item-btn del" onclick="deleteItem(\''+cat.id+'\',\''+item.id+'\')" title="\u5220\u9664">\uD83D\uDDD1\uFE0F</button>';
    html+='</div></div>';

    /* Countdown Section */
    if(status==='warning'||status==='danger'||status==='critical'){
      var deadline=new Date(item.deadline).getTime();
      var diff=deadline-Date.now();
      var animClass=status+'-anim';
      var textClass=status+'-text';
      html+='<div class="bomb-countdown">';
      html+='<span class="bomb-icon '+animClass+'">\uD83D\uDCA3</span>';
      html+='<div><div class="countdown-text '+textClass+'" data-deadline="'+item.deadline+'">'+formatCountdown(diff)+'</div>';
      html+='<div class="countdown-label">\u70B8\u5F39\u5373\u5C06\u5F15\u7206\uFF0C\u5FEB\u53BB\u5B8C\u6210\uFF01</div></div></div>';
    }else if(status==='exploded'){
      html+='<div class="bomb-countdown" style="background:rgba(255,71,87,.1)">';
      html+='<span class="bomb-icon">\uD83D\uDCA5</span>';
      html+='<div class="exploded-text">\uD83D\uDCA5 \u5DF2\u7ECF\u7206\u70B8\u4E86\uFF01\u8D76\u7D27\u5B8C\u6210\uFF01</div></div>';
      html+='<div class="explosion-container">';
      for(var p=0;p<8;p++){
        var angle=p*(360/8);
        var dist=40+Math.random()*30;
        var tx=Math.cos(angle*Math.PI/180)*dist;
        var ty=Math.sin(angle*Math.PI/180)*dist;
        var colors=['#FF6B6B','#FFB347','#FF4757','#FFA502','#FDCB6E'];
        var c=colors[p%colors.length];
        html+='<div class="particle" style="top:50%;left:50%;background:'+c+';--tx:'+tx+'px;--ty:'+ty+'px;animation-delay:'+(p*0.05)+'s"></div>';
      }
      html+='</div>';
    }

    html+='</div>';
  });

  area.innerHTML=html;
}

/* ===== Category Actions ===== */
function selectCategory(id){
  state.selectedCategoryId=id;
  saveData();
  render();
}

function deleteCategory(id){
  var cat=state.categories.find(function(c){return c.id===id});
  if(!cat)return;
  var msg='\u786E\u5B9A\u5220\u9664\u5206\u7C7B\u300C'+cat.name+'\u300D\u5417\uFF1F\u91CC\u9762\u7684\u6240\u6709\u5F85\u529E\u90FD\u4F1A\u88AB\u5220\u9664\uFF01';
  if(!confirm(msg))return;
  state.categories=state.categories.filter(function(c){return c.id!==id});
  if(state.selectedCategoryId===id){
    state.selectedCategoryId=state.categories.length>0?state.categories[0].id:null;
  }
  saveData();
  render();
  showToast('\uD83D\uDCA5 \u5206\u7C7B\u5DF2\u5220\u9664');
}

/* ===== Item Actions ===== */
function toggleItem(catId,itemId){
  var cat=state.categories.find(function(c){return c.id===catId});
  if(!cat)return;
  var item=cat.items.find(function(it){return it.id===itemId});
  if(!item)return;

  item.completed=!item.completed;
  item.completedAt=item.completed?new Date().toISOString():null;
  saveData();

  if(item.completed){
    var card=document.getElementById('card_'+itemId);
    if(card){
      var badge=document.createElement('div');
      badge.className='defused-badge';
      badge.textContent='\u2705';
      card.appendChild(badge);
      setTimeout(function(){render()},600);
    }else{render()}
    showToast('\u2705 \u70B8\u5F39\u5DF2\u62C6\u9664\uFF01\u5E72\u5F97\u6F02\u4EAE\uFF01');
  }else{
    render();
    showToast('\uD83D\uDCA3 \u70B8\u5F39\u5DF2\u91CD\u65B0\u6FC0\u6D3B...');
  }
}

function deleteItem(catId,itemId){
  if(!confirm('\u786E\u5B9A\u5220\u9664\u8FD9\u4E2A\u5F85\u529E\u5417\uFF1F'))return;
  var cat=state.categories.find(function(c){return c.id===catId});
  if(!cat)return;
  cat.items=cat.items.filter(function(it){return it.id!==itemId});
  saveData();
  render();
  showToast('\uD83D\uDDD1\uFE0F \u5DF2\u5220\u9664');
}

/* ===== Modal ===== */
function openModal(id){
  document.getElementById(id).classList.add('show');
  if(id==='catModal'){
    document.getElementById('catNameInput').value='';
    renderColorPicker();
  }
  if(id==='itemModal'){
    document.getElementById('itemTitleInput').value='';
    document.getElementById('itemDeadlineInput').value='';
    document.getElementById('itemReminderInput').value='';
    selectedReminder=30;
    renderReminderPresets();
  }
}
function closeModal(id){document.getElementById(id).classList.remove('show')}

function renderColorPicker(){
  var html='';
  CATEGORY_COLORS.forEach(function(c,i){
    var sel=i===0?'selected':'';
    html+='<div class="color-opt '+sel+'" style="background:'+c+'" data-color="'+c+'" onclick="pickColor(this)"></div>';
  });
  document.getElementById('colorPicker').innerHTML=html;
}

function pickColor(el){
  document.querySelectorAll('.color-opt').forEach(function(e){e.classList.remove('selected')});
  el.classList.add('selected');
}

function renderReminderPresets(){
  var html='';
  REMINDER_PRESETS.forEach(function(p){
    var active=p.value===selectedReminder?'active':'';
    html+='<div class="reminder-chip '+active+'" data-val="'+p.value+'" onclick="pickReminder(this,'+p.value+')">'+p.label+'</div>';
  });
  document.getElementById('reminderPresets').innerHTML=html;
}

function pickReminder(el,val){
  selectedReminder=val;
  document.querySelectorAll('.reminder-chip').forEach(function(e){e.classList.remove('active')});
  el.classList.add('active');
  document.getElementById('itemReminderInput').value='';
}

/* ===== Form Handlers ===== */
function handleCatSubmit(e){
  e.preventDefault();
  var name=document.getElementById('catNameInput').value.trim();
  if(!name)return false;
  var colorEl=document.querySelector('.color-opt.selected');
  var color=colorEl?colorEl.dataset.color:CATEGORY_COLORS[0];
  var cat={id:genId(),name:name,color:color,items:[]};
  state.categories.push(cat);
  state.selectedCategoryId=cat.id;
  saveData();
  closeModal('catModal');
  render();
  showToast('\uD83C\uDF89 \u5206\u7C7B\u300C'+name+'\u300D\u521B\u5EFA\u6210\u529F\uFF01');
  return false;
}

function handleItemSubmit(e){
  e.preventDefault();
  var cat=getSelectedCategory();
  if(!cat){
    showToast('\u8BF7\u5148\u521B\u5EFA\u4E00\u4E2A\u5206\u7C7B');
    return false;
  }
  var title=document.getElementById('itemTitleInput').value.trim();
  var deadline=document.getElementById('itemDeadlineInput').value;
  var customMin=parseInt(document.getElementById('itemReminderInput').value);
  var reminderMin=customMin>0?customMin:selectedReminder;

  if(!title||!deadline)return false;

  var item={
    id:genId(),
    title:title,
    deadline:deadline,
    reminderMinutes:reminderMin,
    completed:false,
    completedAt:null,
    createdAt:new Date().toISOString()
  };
  cat.items.push(item);
  saveData();
  closeModal('itemModal');
  render();
  showToast('\uD83D\uDCA3 \u5F85\u529E\u5DF2\u6DFB\u52A0\uFF0C\u70B8\u5F39\u5F00\u59CB\u8BA1\u65F6\uFF01');
  return false;
}

/* ===== Countdown Timer ===== */
function startCountdown(){
  if(countdownTimer)clearInterval(countdownTimer);
  countdownTimer=setInterval(function(){
    var els=document.querySelectorAll('.countdown-text[data-deadline]');
    var needRerender=false;
    els.forEach(function(el){
      var deadline=new Date(el.dataset.deadline).getTime();
      var diff=deadline-Date.now();
      if(diff<=0){
        needRerender=true;
      }else{
        el.textContent=formatCountdown(diff);
      }
    });
    if(needRerender)render();
  },1000);
}

/* ===== Browser Notifications ===== */
function requestNotification(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}

/* ===== FAB ===== */
document.getElementById('fabBtn').addEventListener('click',function(){
  if(state.categories.length===0){
    openModal('catModal');
  }else{
    openModal('itemModal');
  }
});

/* ===== Click outside modal ===== */
document.querySelectorAll('.modal-overlay').forEach(function(el){
  el.addEventListener('click',function(e){
    if(e.target===el)closeModal(el.id);
  });
});

/* ===== Init ===== */
render();
startCountdown();
requestNotification();
</script>
</body>
</html>
